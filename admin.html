<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Links Dashboard</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #0f1115;
        --panel: #181c24;
        --text: #f4f6fb;
        --muted: #a7b1c2;
        --border: #2a3240;
        --accent: #5b8cff;
        --danger: #ff6b6b;
        --success: #37c273;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
        background: var(--bg);
        color: var(--text);
      }

      .wrap {
        max-width: 760px;
        margin: 0 auto;
        padding: 2rem 1rem 4rem;
      }

      h1 {
        margin: 0 0 0.35rem;
        font-size: 1.85rem;
      }

      p {
        margin: 0 0 1.2rem;
        color: var(--muted);
      }

      form {
        display: grid;
        gap: 0.95rem;
        padding: 1rem;
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 10px;
      }

      label {
        display: grid;
        gap: 0.45rem;
        font-size: 0.95rem;
      }

      input {
        width: 100%;
        border: 1px solid var(--border);
        background: #10141b;
        color: var(--text);
        border-radius: 8px;
        padding: 0.62rem 0.72rem;
        font-size: 0.95rem;
      }

      .actions {
        display: flex;
        gap: 0.75rem;
        margin-top: 0.4rem;
      }

      button {
        border: 0;
        border-radius: 8px;
        padding: 0.62rem 0.95rem;
        font-weight: 600;
        cursor: pointer;
      }

      #saveBtn {
        background: var(--accent);
        color: #fff;
      }

      #reloadBtn {
        background: transparent;
        color: var(--text);
        border: 1px solid var(--border);
      }

      #status {
        margin-top: 0.9rem;
        min-height: 1.2rem;
        font-size: 0.92rem;
        color: var(--muted);
      }

      .ok {
        color: var(--success);
      }

      .err {
        color: var(--danger);
      }

      .hidden {
        display: none;
      }

      .toolbar {
        display: flex;
        justify-content: flex-end;
        margin-bottom: 0.8rem;
      }

      #logoutBtn {
        background: transparent;
        color: var(--text);
        border: 1px solid var(--border);
      }
    </style>
  </head>
  <body>
    <main class="wrap">
      <h1>Links Dashboard</h1>
      <p>Edit links, then click Save. This writes to <code>data/links.json</code>.</p>

      <form id="loginForm">
        <label>
          Admin username
          <input id="adminUser" type="text" autocomplete="username" required />
        </label>
        <label>
          Admin password
          <input
            id="adminPass"
            type="password"
            autocomplete="current-password"
            required
          />
        </label>
        <div class="actions">
          <button id="loginBtn" type="submit">Login</button>
        </div>
        <div id="loginStatus" role="status" aria-live="polite"></div>
      </form>

      <section id="dashboard" class="hidden">
        <div class="toolbar">
          <button id="logoutBtn" type="button">Logout</button>
        </div>
        <form id="linksForm">
        <label>
          Instagram URL
          <input id="instagramUrl" type="url" required />
        </label>
        <label>
          Instagram handle text
          <input id="instagramHandle" type="text" required />
        </label>
        <label>
          WhatsApp URL
          <input id="whatsappUrl" type="url" required />
        </label>
        <label>
          Phone display text
          <input id="phoneDisplay" type="text" required />
        </label>
        <label>
          Phone raw value (for copy button)
          <input id="phoneRaw" type="text" required />
        </label>
        <label>
          Fashion gallery URL
          <input id="fashionGalleryUrl" type="url" required />
        </label>
        <label>
          UGC gallery URL
          <input id="ugcGalleryUrl" type="url" required />
        </label>
        <label>
          Events gallery URL
          <input id="eventsGalleryUrl" type="url" required />
        </label>

        <div class="actions">
          <button id="saveBtn" type="submit">Save links</button>
          <button id="reloadBtn" type="button">Reload from JSON</button>
        </div>
        <div id="status" role="status" aria-live="polite"></div>
        </form>
      </section>
    </main>

    <script>
      const fields = [
        "instagramUrl",
        "instagramHandle",
        "whatsappUrl",
        "phoneDisplay",
        "phoneRaw",
        "fashionGalleryUrl",
        "ugcGalleryUrl",
        "eventsGalleryUrl",
      ];

      const loginFormEl = document.getElementById("loginForm");
      const loginStatusEl = document.getElementById("loginStatus");
      const dashboardEl = document.getElementById("dashboard");
      const statusEl = document.getElementById("status");
      const formEl = document.getElementById("linksForm");
      const reloadBtn = document.getElementById("reloadBtn");
      const logoutBtn = document.getElementById("logoutBtn");
      let authUser = "";
      let authPass = "";

      function setLoginStatus(message, tone) {
        loginStatusEl.textContent = message;
        loginStatusEl.className = tone || "";
      }

      function setStatus(message, tone) {
        statusEl.textContent = message;
        statusEl.className = tone || "";
      }

      function showDashboard(isLoggedIn) {
        if (isLoggedIn) {
          loginFormEl.classList.add("hidden");
          dashboardEl.classList.remove("hidden");
        } else {
          dashboardEl.classList.add("hidden");
          loginFormEl.classList.remove("hidden");
        }
      }

      async function loadLinks() {
        setStatus("Loading current links...");
        try {
          const res = await fetch("/data/links.json", { cache: "no-store" });
          if (!res.ok) throw new Error("Could not load links JSON");
          const data = await res.json();
          fields.forEach((id) => {
            const el = document.getElementById(id);
            if (el && typeof data[id] === "string") {
              el.value = data[id];
            }
          });
          setStatus("Loaded.", "ok");
        } catch (err) {
          setStatus(err.message || "Failed to load links.", "err");
        }
      }

      loginFormEl.addEventListener("submit", async function (event) {
        event.preventDefault();
        const adminUser = document.getElementById("adminUser").value.trim();
        const adminPass = document.getElementById("adminPass").value.trim();

        setLoginStatus("Checking login...");
        try {
          const res = await fetch("/.netlify/functions/admin-login", {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
              "x-admin-user": adminUser,
              "x-admin-pass": adminPass,
            },
          });
          const result = await res.json();
          if (!res.ok) {
            throw new Error(result.error || "Wrong username or password.");
          }
          authUser = adminUser;
          authPass = adminPass;
          setLoginStatus("Login successful.", "ok");
          showDashboard(true);
          loadLinks();
          return;
        } catch (err) {
          setLoginStatus(err.message || "Wrong username or password.", "err");
        }
      });

      logoutBtn.addEventListener("click", function () {
        authUser = "";
        authPass = "";
        showDashboard(false);
        setStatus("");
        setLoginStatus("Logged out.");
      });

      formEl.addEventListener("submit", async function (event) {
        event.preventDefault();
        if (!authUser || !authPass) {
          setStatus("Login required.", "err");
          return;
        }

        const payload = {};
        fields.forEach((id) => {
          payload[id] = document.getElementById(id).value.trim();
        });

        setStatus("Saving...");
        try {
          const res = await fetch("/.netlify/functions/update-links", {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
              "x-admin-user": authUser,
              "x-admin-pass": authPass,
            },
            body: JSON.stringify(payload),
          });

          const result = await res.json();
          if (!res.ok) {
            throw new Error(result.error || "Failed to save links");
          }
          setStatus("Saved. Netlify will redeploy with new links.", "ok");
        } catch (err) {
          setStatus(err.message || "Failed to save links.", "err");
        }
      });

      reloadBtn.addEventListener("click", loadLinks);
      showDashboard(false);
    </script>
  </body>
</html>
