<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Links Dashboard</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #0f1115;
        --panel: #181c24;
        --text: #f4f6fb;
        --muted: #a7b1c2;
        --border: #2a3240;
        --accent: #5b8cff;
        --danger: #ff6b6b;
        --success: #37c273;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
        background: var(--bg);
        color: var(--text);
      }

      .wrap {
        max-width: 860px;
        margin: 0 auto;
        padding: 2rem 1rem 4rem;
      }

      h1 {
        margin: 0 0 0.35rem;
        font-size: 1.85rem;
      }

      p {
        margin: 0 0 1.2rem;
        color: var(--muted);
      }

      form {
        display: grid;
        gap: 0.95rem;
        padding: 1rem;
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 10px;
      }

      label {
        display: grid;
        gap: 0.45rem;
        font-size: 0.95rem;
      }

      input,
      textarea {
        width: 100%;
        border: 1px solid var(--border);
        background: #10141b;
        color: var(--text);
        border-radius: 8px;
        padding: 0.62rem 0.72rem;
        font-size: 0.95rem;
      }

      textarea {
        min-height: 170px;
        line-height: 1.45;
        resize: vertical;
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      }

      .actions {
        display: flex;
        gap: 0.75rem;
        margin-top: 0.4rem;
        flex-wrap: wrap;
      }

      button {
        border: 0;
        border-radius: 8px;
        padding: 0.62rem 0.95rem;
        font-weight: 600;
        cursor: pointer;
      }

      #saveBtn,
      #loginBtn,
      #addFashionVideoBtn {
        background: var(--accent);
        color: #fff;
      }

      #reloadBtn,
      #logoutBtn,
      .remove-fashion-video {
        background: transparent;
        color: var(--text);
        border: 1px solid var(--border);
      }

      #status,
      #loginStatus {
        margin-top: 0.5rem;
        min-height: 1.2rem;
        font-size: 0.92rem;
        color: var(--muted);
      }

      .ok {
        color: var(--success);
      }

      .err {
        color: var(--danger);
      }

      .hidden {
        display: none;
      }

      .toolbar {
        display: flex;
        justify-content: flex-end;
        margin-bottom: 0.8rem;
      }

      .field-help {
        margin: 0.2rem 0 0;
        font-size: 0.8rem;
        color: var(--muted);
      }

      .tabs {
        display: flex;
        gap: 0.5rem;
        flex-wrap: wrap;
      }

      .tab-btn {
        border: 1px solid var(--border);
        background: transparent;
        color: var(--text);
      }

      .tab-btn.is-active {
        background: var(--accent);
        border-color: transparent;
      }

      .tab-panel {
        display: none;
        gap: 0.95rem;
      }

      .tab-panel.is-active {
        display: grid;
      }

      .fashion-list {
        display: grid;
        gap: 0.8rem;
      }

      .fashion-item {
        display: grid;
        gap: 0.6rem;
        padding: 0.8rem;
        border: 1px solid var(--border);
        border-radius: 8px;
        background: #121722;
      }
    </style>
  </head>
  <body>
    <main class="wrap">
      <h1>Links Dashboard</h1>
      <p>Edit links, videos, and labels, then save to <code>data/links.json</code>.</p>

      <form id="loginForm">
        <label>
          Admin username
          <input id="adminUser" type="text" autocomplete="username" required />
        </label>
        <label>
          Admin password
          <input
            id="adminPass"
            type="password"
            autocomplete="current-password"
            required
          />
        </label>
        <div class="actions">
          <button id="loginBtn" type="submit">Login</button>
        </div>
        <div id="loginStatus" role="status" aria-live="polite"></div>
      </form>

      <section id="dashboard" class="hidden">
        <div class="toolbar">
          <button id="logoutBtn" type="button">Logout</button>
        </div>
        <form id="linksForm">
          <div class="tabs" role="tablist" aria-label="Admin sections">
            <button class="tab-btn is-active" type="button" data-tab="data">Data</button>
            <button class="tab-btn" type="button" data-tab="fashion">Fashion</button>
            <button class="tab-btn" type="button" data-tab="ugc">UGC</button>
            <button class="tab-btn" type="button" data-tab="events">Events</button>
          </div>

          <section class="tab-panel is-active" data-panel="data">
            <label>
              Instagram URL
              <input id="instagramUrl" type="url" required />
            </label>
            <label>
              Instagram handle text
              <input id="instagramHandle" type="text" required />
            </label>
            <label>
              WhatsApp URL
              <input id="whatsappUrl" type="url" required />
            </label>
            <label>
              Phone display text
              <input id="phoneDisplay" type="text" required />
            </label>
            <label>
              Phone raw value (for copy button)
              <input id="phoneRaw" type="text" required />
            </label>
            <label>
              Fashion gallery URL
              <input id="fashionGalleryUrl" type="url" required />
            </label>
            <label>
              UGC gallery URL
              <input id="ugcGalleryUrl" type="url" required />
            </label>
            <label>
              Events gallery URL
              <input id="eventsGalleryUrl" type="url" required />
            </label>
          </section>

          <section class="tab-panel" data-panel="fashion">
            <p class="field-help">
              Add each fashion video with title + Google Drive preview link.
            </p>
            <div id="fashionVideosList" class="fashion-list"></div>
            <div class="actions">
              <button id="addFashionVideoBtn" type="button">Add fashion video</button>
            </div>
          </section>

          <section class="tab-panel" data-panel="ugc">
            <label>
              UGC videos JSON (array of {title, label, previewUrl})
              <textarea id="ugcVideosJson" required></textarea>
              <p class="field-help">Use label for card text, title for iframe title.</p>
            </label>
          </section>

          <section class="tab-panel" data-panel="events">
            <label>
              Events videos JSON (array of {title, label, previewUrl})
              <textarea id="eventsVideosJson" required></textarea>
              <p class="field-help">Use label for event name under the video.</p>
            </label>
          </section>

          <div class="actions">
            <button id="saveBtn" type="submit">Save links</button>
            <button id="reloadBtn" type="button">Reload from JSON</button>
          </div>
          <div id="status" role="status" aria-live="polite"></div>
        </form>
      </section>
    </main>

    <script>
      const scalarFields = [
        "instagramUrl",
        "instagramHandle",
        "whatsappUrl",
        "phoneDisplay",
        "phoneRaw",
        "fashionGalleryUrl",
        "ugcGalleryUrl",
        "eventsGalleryUrl",
      ];

      const loginFormEl = document.getElementById("loginForm");
      const loginStatusEl = document.getElementById("loginStatus");
      const dashboardEl = document.getElementById("dashboard");
      const statusEl = document.getElementById("status");
      const formEl = document.getElementById("linksForm");
      const reloadBtn = document.getElementById("reloadBtn");
      const logoutBtn = document.getElementById("logoutBtn");
      const tabs = Array.prototype.slice.call(document.querySelectorAll(".tab-btn"));
      const panels = Array.prototype.slice.call(document.querySelectorAll(".tab-panel"));
      const fashionListEl = document.getElementById("fashionVideosList");
      const addFashionVideoBtn = document.getElementById("addFashionVideoBtn");
      let authUser = "";
      let authPass = "";

      function setLoginStatus(message, tone) {
        loginStatusEl.textContent = message;
        loginStatusEl.className = tone || "";
      }

      function setStatus(message, tone) {
        statusEl.textContent = message;
        statusEl.className = tone || "";
      }

      function stringifyJson(value) {
        return JSON.stringify(value, null, 2);
      }

      function parseJsonField(id, fieldName) {
        const raw = document.getElementById(id).value.trim();
        let parsed;
        try {
          parsed = JSON.parse(raw);
        } catch (err) {
          throw new Error(fieldName + " must be valid JSON array.");
        }
        if (!Array.isArray(parsed) || parsed.length === 0) {
          throw new Error(fieldName + " must be a non-empty array.");
        }
        return parsed;
      }

      function showDashboard(isLoggedIn) {
        if (isLoggedIn) {
          loginFormEl.classList.add("hidden");
          dashboardEl.classList.remove("hidden");
        } else {
          dashboardEl.classList.add("hidden");
          loginFormEl.classList.remove("hidden");
        }
      }

      function setActiveTab(tabName) {
        tabs.forEach(function (btn) {
          const active = btn.getAttribute("data-tab") === tabName;
          btn.classList.toggle("is-active", active);
        });
        panels.forEach(function (panel) {
          const active = panel.getAttribute("data-panel") === tabName;
          panel.classList.toggle("is-active", active);
        });
      }

      function createFashionVideoRow(video) {
        const item = document.createElement("div");
        item.className = "fashion-item";
        item.innerHTML =
          '<label>Video title<input type="text" class="fashion-title" required /></label>' +
          '<label>Preview URL<input type="url" class="fashion-preview" required /></label>' +
          '<div class="actions"><button type="button" class="remove-fashion-video">Remove</button></div>';
        item.querySelector(".fashion-title").value = video && video.title ? video.title : "";
        item.querySelector(".fashion-preview").value =
          video && video.previewUrl ? video.previewUrl : "";
        return item;
      }

      function renderFashionVideos(videos) {
        fashionListEl.innerHTML = "";
        const list = Array.isArray(videos) && videos.length ? videos : [{ title: "", previewUrl: "" }];
        list.forEach(function (video) {
          fashionListEl.appendChild(createFashionVideoRow(video));
        });
      }

      function collectFashionVideos() {
        const rows = Array.prototype.slice.call(
          fashionListEl.querySelectorAll(".fashion-item"),
        );
        if (!rows.length) {
          throw new Error("Add at least one fashion video.");
        }

        return rows.map(function (row, index) {
          const title = row.querySelector(".fashion-title").value.trim();
          const previewUrl = row.querySelector(".fashion-preview").value.trim();
          if (!title) {
            throw new Error("Fashion video #" + (index + 1) + " title is required.");
          }
          if (!previewUrl) {
            throw new Error("Fashion video #" + (index + 1) + " preview URL is required.");
          }
          return { title: title, previewUrl: previewUrl };
        });
      }

      async function loadLinks() {
        setStatus("Loading current links...");
        try {
          const res = await fetch("/data/links.json", { cache: "no-store" });
          if (!res.ok) throw new Error("Could not load links JSON");
          const data = await res.json();
          scalarFields.forEach(function (id) {
            const el = document.getElementById(id);
            if (el && typeof data[id] === "string") {
              el.value = data[id];
            }
          });

          renderFashionVideos(data.fashionVideos || []);
          document.getElementById("ugcVideosJson").value = stringifyJson(
            data.ugcVideos || [],
          );
          document.getElementById("eventsVideosJson").value = stringifyJson(
            data.eventsVideos || [],
          );
          setStatus("Loaded.", "ok");
        } catch (err) {
          setStatus(err.message || "Failed to load links.", "err");
        }
      }

      tabs.forEach(function (btn) {
        btn.addEventListener("click", function () {
          setActiveTab(btn.getAttribute("data-tab"));
        });
      });

      addFashionVideoBtn.addEventListener("click", function () {
        fashionListEl.appendChild(createFashionVideoRow({ title: "", previewUrl: "" }));
      });

      fashionListEl.addEventListener("click", function (event) {
        const removeBtn = event.target.closest(".remove-fashion-video");
        if (!removeBtn) return;
        const row = removeBtn.closest(".fashion-item");
        if (row) row.remove();
      });

      loginFormEl.addEventListener("submit", async function (event) {
        event.preventDefault();
        const adminUser = document.getElementById("adminUser").value.trim();
        const adminPass = document.getElementById("adminPass").value.trim();

        setLoginStatus("Checking login...");
        try {
          const res = await fetch("/.netlify/functions/admin-login", {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
              "x-admin-user": adminUser,
              "x-admin-pass": adminPass,
            },
          });
          const result = await res.json();
          if (!res.ok) {
            throw new Error(result.error || "Wrong username or password.");
          }
          authUser = adminUser;
          authPass = adminPass;
          setLoginStatus("Login successful.", "ok");
          showDashboard(true);
          setActiveTab("data");
          loadLinks();
        } catch (err) {
          setLoginStatus(err.message || "Wrong username or password.", "err");
        }
      });

      logoutBtn.addEventListener("click", function () {
        authUser = "";
        authPass = "";
        showDashboard(false);
        setStatus("");
        setLoginStatus("Logged out.");
      });

      formEl.addEventListener("submit", async function (event) {
        event.preventDefault();
        if (!authUser || !authPass) {
          setStatus("Login required.", "err");
          return;
        }

        const payload = {};
        scalarFields.forEach(function (id) {
          payload[id] = document.getElementById(id).value.trim();
        });

        try {
          payload.fashionVideos = collectFashionVideos();
          payload.ugcVideos = parseJsonField("ugcVideosJson", "UGC videos JSON");
          payload.eventsVideos = parseJsonField("eventsVideosJson", "Events videos JSON");
        } catch (err) {
          setStatus(err.message, "err");
          return;
        }

        setStatus("Saving...");
        try {
          const res = await fetch("/.netlify/functions/update-links", {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
              "x-admin-user": authUser,
              "x-admin-pass": authPass,
            },
            body: JSON.stringify(payload),
          });

          const result = await res.json();
          if (!res.ok) {
            throw new Error(result.error || "Failed to save links");
          }
          setStatus("Saved. Netlify will redeploy with new links.", "ok");
        } catch (err) {
          setStatus(err.message || "Failed to save links.", "err");
        }
      });

      reloadBtn.addEventListener("click", loadLinks);
      showDashboard(false);
    </script>
  </body>
</html>
